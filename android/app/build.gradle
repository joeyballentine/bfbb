plugins {
    id 'com.android.application'
}

// third_party/SDL's own Java half, compiled straight out of the submodule.
//
// SDLActivity and the dozen classes beside it ARE the Android port of SDL --
// the surface, the input plumbing, the audio device and the lifecycle all live
// on that side of JNI, and the native library is useless without them. They
// are compiled from where they are rather than copied here, so that the SDL
// submodule moving forward moves both halves at once; a stale copy of
// SDLActivity against a newer libSDL3 is a missing-method crash at startup.
def sdlJava = file('../../third_party/SDL/android-project/app/src/main/java')

// The button prompt glyphs. A desktop build copies res/buttons beside the
// executable; here they go in the APK's assets and BfbbActivity extracts them
// into internal storage, which is where the game looks.
def portRes = file('../../src/SB/Core/pc/res')

android {
    namespace = 'io.github.joeyballentine.bfbb'
    compileSdk = 35

    // The NDK the SDL submodule's own template pins. Anything newer works;
    // pinning means the toolchain is the same on a contributor's machine and
    // on CI, which matters here because the compiler is what decides whether
    // the game's arithmetic comes out the same.
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'io.github.joeyballentine.bfbb'

        // 24 rather than SDL's 21: the port wants GLES 3.1 where it can get
        // it, and the scoped-storage behaviour the asset import is written
        // against (docs/ANDROID.md, "Importing the game files") is not worth having two answers
        // for. Nothing below 24 is a device anyone is going to run this on.
        minSdk = 24
        targetSdk = 35

        versionCode = 1
        versionName = '0.1'

        externalNativeBuild {
            cmake {
                // ANDROID_STL: the game is C++ and librw is C++, and the
                // shared runtime would be a second .so in the APK for one
                // library's benefit.
                //
                // BFBB_RENDER_BACKENDS: the two backends that draw off
                // Windows. video.backend picks between them at run time.
                // -Pbfbb.backends=GL3 or =VULKAN builds an APK with one.
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-24',
                          '-DBFBB_RENDER_BACKENDS=' + (project.findProperty('bfbb.backends') ?: 'GL3;VULKAN')

                // Just the game. Without this, AGP builds every target the
                // CMake project defines -- which here would include librw's
                // and SDL's own extras, none of which go in the APK.
                targets 'main'
            }
        }

        // arm64 only, for now, and the choice is not arbitrary: see
        // docs/ANDROID.md, "Arena below 4 GB". The game allocator addresses its
        // arena with a 32-bit integer, and whether a 64-bit Android process
        // can get a mapping below 4 GB is the question the whole port turns
        // on. armeabi-v7a is the fallback if it cannot -- 32-bit pointers
        // make the question disappear -- and is one line here.
        //
        // -Pbfbb.abis=x86_64 builds for the x86_64 emulator instead.
        ndk {
            abiFilters(*((project.findProperty('bfbb.abis') ?: 'arm64-v8a').split(',')))
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // The native half is what is being debugged; leave it alone.
            jniDebuggable = true

            // Optimised, with symbols. AGP builds a debug variant's native
            // code as CMake Debug, which is -O0: the game at a third of its
            // speed, and every frame time measured against it wrong.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            assets.srcDirs += portRes
        }
    }

    // res/ also holds the Windows icon and resource scripts.
    androidResources {
        ignoreAssetsPattern '!*.ico:!*.rc'
    }

    externalNativeBuild {
        cmake {
            // The port's one build file, three directories up. Gradle passes
            // the NDK toolchain file and ANDROID_ABI; everything else about
            // the configuration is the same as a desktop build's.
            path = file('../../CMakeLists.txt')
            version = '3.22.1'
        }
    }

    lint {
        abortOnError = false
    }
}
